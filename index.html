<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Player da tela da TV</title>
<meta name="referrer" content="strict-origin-when-cross-origin">
<style>html, body { margin: 0; background: #000; overflow: hidden; } #p { width: 100vw; height: 100vh; }</style>
</head><body>
<div id="p"></div>
<script>
  // Player do YouTube que a tela da TV mostra num canto; recebe comandos (voltar, pausar, avançar) e devolve o estado
  const LISTA = new URLSearchParams(location.search).get('list') || 'PLUJG0DHpl7us';
  let p;
  function onYouTubeIframeAPIReady() {
    p = new YT.Player('p', {
      width: '100%', height: '100%',
      playerVars: { listType: 'playlist', list: LISTA, autoplay: 0, controls: 0, rel: 0, playsinline: 1, loop: 1 },
      events: { onReady: pronto, onStateChange: enviar, onError: e => parent.postMessage({ tipo: 'erro', codigo: e.data }, '*') }
    });
  }
  // comando que chegou antes do player ficar pronto roda assim que ele fica
  let pendente = null, preparado = false;
  function pronto() { preparado = true; parent.postMessage({ tipo: 'pronto' }, '*'); if (pendente) { executar(pendente); pendente = null; } }
  function executar(c) {
    if (c === 'alternar') p.getPlayerState() === 1 ? p.pauseVideo() : p.playVideo();
    if (c === 'tocar') p.playVideo();
    if (c === 'pausar') p.pauseVideo();
    if (c === 'avancar') p.nextVideo();
    if (c === 'voltar') p.previousVideo();
    setTimeout(enviar, 600);
  }
  function enviar() {
    if (!p || !p.getVideoData) return;
    const d = p.getVideoData();
    parent.postMessage({ tipo: 'estado', titulo: d.title, autor: d.author, tocando: p.getPlayerState() === 1, estado: p.getPlayerState() }, '*');
  }
  setInterval(enviar, 2000);
  addEventListener('message', ev => {
    const c = ev.data && ev.data.cmd;
    if (!c) return;
    if (!preparado) { pendente = c; return; }
    executar(c);
  });
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body></html>
